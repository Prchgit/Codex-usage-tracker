name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tests/mcp_smoke.py
      - run: node tests/dashboard_smoke.cjs
      - run: clang -fobjc-arc -fmodules native/UsagePanel.m native/ScreenDetection.m -o /tmp/CodexUsagePanel-test -framework Cocoa
      - run: /tmp/CodexUsagePanel-test --self-test
