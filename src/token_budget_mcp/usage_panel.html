<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;font-size:13px;color:var(--color-text-primary,light-dark(#17202b,#eee));background:transparent}body{margin:0}.panel{border:1px solid var(--color-border-primary,light-dark(#dce1e8,#41444b));border-radius:14px;overflow:hidden;background:var(--color-background-primary,light-dark(#fff,#212228))}header{display:flex;align-items:center;gap:8px;padding:12px 14px}h1{font-size:13px;margin:0;flex:1;line-height:1.5}button{font:inherit;color:inherit;border:0;background:transparent;border-radius:6px;cursor:pointer;padding:4px 8px}button:hover{background:light-dark(#eef0f4,#373941)}article{padding:12px 14px;border-top:1px solid light-dark(#e5e7eb,#373941)}.name{font-weight:600;overflow-wrap:anywhere}.state,.tokens,footer{color:var(--color-text-secondary,light-dark(#626975,#aaa));font-size:12px}.state{margin:4px 0}.credits{margin-top:7px}.tokens{font-variant-numeric:tabular-nums}footer{padding:9px 14px;border-top:1px solid light-dark(#e5e7eb,#373941);line-height:1.5}#error{color:light-dark(#a23828,#ffae9e)}[hidden]{display:none!important}
</style>
<section class="panel" aria-label="Codex Usage Tracker"><header><h1 id="heading">CUT · Usage unavailable</h1><button id="refresh" aria-label="Refresh usage">↻</button><button id="collapse" aria-label="Minimize to header" aria-expanded="true">−</button></header><div id="body"><div id="rows"></div><footer><div id="status" role="status">Connecting to Codex…</div><div id="error" role="alert"></div><div>Local chat totals · Standard-speed credit estimates</div></footer></div></section>
<script>
const $=id=>document.getElementById(id),pending=new Map();let nextId=1,ready=false,busy=false,lastData=null;
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function request(method,params){return new Promise((resolve,reject)=>{const id=nextId++;const timer=setTimeout(()=>{pending.delete(id);reject(Error('Host did not respond'))},10000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function size(){notify('ui/notifications/size-changed',{height:document.documentElement.scrollHeight})}
function number(v){return typeof v==='number'&&Number.isFinite(v)?v.toLocaleString():'—'}
function line(parent,text,cls){const el=document.createElement('div');el.className=cls;el.textContent=text;parent.append(el)}
function render(data){if(!data||!Array.isArray(data.sessions))return;lastData=data;const account=data.account_usage;let limits=Array.isArray(account?.limits)?account.limits:[];if(limits.some(l=>l.limit_id==='codex'))limits=limits.filter(l=>l.limit_id==='codex');const parts=limits.filter(l=>typeof l.used_percent==='number').map(l=>`${l.label||l.limit_id||'Usage'} ${Math.round(l.used_percent)}%`);$('heading').textContent='CUT · '+(parts.length?parts.join(' · ')+' used'+(account?.stale?' (stale)':''):'Usage unavailable');$('heading').title='Account-wide limits; separate from chat credit estimates. Updated: '+(account?.updated_at||'unavailable');$('rows').replaceChildren();for(const row of data.sessions){const el=document.createElement('article');line(el,row.chat_name||'Unnamed chat','name');line(el,[row.status,row.model,row.reasoning_effort].filter(Boolean).join(' · '),'state');const u=row.usage||{};const partial=row.usage_coverage_complete===false||row.missing_usage_turns>0||row.unsupported_usage_turns>0;line(el,`New ${number(u.new_input_tokens)} · Cache ${number(u.cached_input_tokens)} · Out ${number(u.output_tokens)}${partial?' · partial':''}`,'tokens');const credits=row.credit_coverage_complete?row.estimated_credits:row.credit_priced_calls>0?row.known_estimated_credits:null;line(el,credits!=null&&Number.isFinite(Number(credits))?`Credits ≈${Number(credits).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:3})}${row.credit_coverage_complete?'':' · partial'}`:'Credits unavailable','credits');$('rows').append(el)}if(!data.sessions.length)line($('rows'),'No recorded chats yet','state');$('status').textContent=`${data.truncated?'First 20 active chats · ':''}Updated ${data.updated_at?new Date(data.updated_at).toLocaleTimeString():'time unavailable'} · refresh every 5s`;$('error').textContent='';size()}
async function refresh(){if(!ready||busy||document.hidden)return;busy=true;try{const value=await request('tools/call',{name:'read_usage_panel',arguments:{}});if(value.isError||!value.structuredContent)throw Error('Collector unavailable');render(value.structuredContent)}catch(error){$('error').textContent='Live refresh unavailable. Last reading retained; retry with ↻.';size()}finally{busy=false}}
function collapse(value){$('body').hidden=value;$('collapse').textContent=value?'＋':'−';$('collapse').setAttribute('aria-expanded',String(!value));$('collapse').setAttribute('aria-label',value?'Expand usage panel':'Minimize to header');try{localStorage.setItem('cut-inline-collapsed',String(value))}catch{}size()}
$('collapse').onclick=()=>collapse(!$('body').hidden);$('refresh').onclick=refresh;try{if(localStorage.getItem('cut-inline-collapsed')==='true')collapse(true)}catch{}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(Error(m.error.message||'Host error')):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent);if(m.method==='ui/notifications/host-context-changed'&&m.params?.theme)document.documentElement.style.colorScheme=m.params.theme;if(m.method==='ui/resource-teardown'){ready=false;if(m.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*')}});
(async()=>{try{const host=await request('ui/initialize',{appInfo:{name:'CUT Usage Panel',version:'0.3.0'},appCapabilities:{},protocolVersion:'2026-01-26'});ready=true;if(host?.hostContext?.theme)document.documentElement.style.colorScheme=host.hostContext.theme;notify('ui/notifications/initialized',{});await refresh();setInterval(refresh,5000)}catch{$('status').textContent='This view requires an MCP Apps-compatible host.'}})();
</script></html>
